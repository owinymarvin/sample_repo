server:
  port: 8081
spring:
  application:
    name: camunda
camunda:
  bpm:
    admin-user.id: camunda
    admin-user.password: camunda
    generic-properties:
      properties:
        enforce-history-time-to-live: false
    deployment-resource-pattern: classpath*:processes/**/*.bpmn
http:
  applications:
    document:
      url: http://${DOCUMENT_URL:localhost}:9000/api/document
    notification:
      url: http://${NOTIFICATION_URL:localhost}:9001/api/notification
